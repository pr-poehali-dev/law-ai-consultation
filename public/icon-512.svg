<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Фон -->
  <rect width="512" height="512" rx="100" fill="#0a1628"/>

  <!-- Весы — верхняя перекладина (коромысло) -->
  <rect x="146" y="192" width="220" height="10" rx="5" fill="#e8a820"/>

  <!-- Центральная стойка -->
  <rect x="251" y="160" width="10" height="192" rx="5" fill="#e8a820"/>

  <!-- Вершина треугольника -->
  <polygon points="256,122 232,168 280,168" fill="#e8a820"/>

  <!-- Левая чаша — верёвки -->
  <line x1="180" y1="202" x2="158" y2="256" stroke="#e8a820" stroke-width="6" stroke-linecap="round"/>
  <line x1="180" y1="202" x2="202" y2="256" stroke="#e8a820" stroke-width="6" stroke-linecap="round"/>

  <!-- Правая чаша — верёвки -->
  <line x1="332" y1="202" x2="310" y2="256" stroke="#e8a820" stroke-width="6" stroke-linecap="round"/>
  <line x1="332" y1="202" x2="354" y2="256" stroke="#e8a820" stroke-width="6" stroke-linecap="round"/>

  <!-- Левая чаша -->
  <path d="M148 256 Q180 294 212 256" stroke="#e8a820" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Правая чаша -->
  <path d="M300 256 Q332 294 364 256" stroke="#e8a820" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Основание -->
  <rect x="218" y="352" width="76" height="10" rx="5" fill="#e8a820" opacity="0.7"/>
  <rect x="196" y="362" width="120" height="10" rx="5" fill="#e8a820" opacity="0.5"/>

  <!-- Текст -->
  <text x="256" y="420" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#e8a820" text-anchor="middle">ИИ-ПРАВО</text>
</svg>
